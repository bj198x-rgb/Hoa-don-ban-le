<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#356854">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hóa đơn lẻ">
<title>AN MAITRI – Bảng kê hóa đơn</title>
<style>
  :root { --g:#356854; --g1:#4a8a70; --g2:#2a5443; --gd:#1f4535; --bg:#eef3f0; --card:#fff; --line:#dbe4df; --tx:#1d2b25; --mut:#667770; --warn:#c2410c; --ok:#15803d; --bad:#b91c1c; --amber:#d97706; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(135deg,#3f7a63,#2a5443); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; justify-content:space-between; border-radius:0 0 22px 22px; box-shadow:0 6px 16px rgba(31,69,53,.35); }
  header h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.01em; }
  header small { display:block; opacity:.85; font-weight:400; font-size:12px; margin-top:2px; }
  .icon { width:44px; height:44px; border-radius:50%; border:0; color:#fff; font-size:21px; background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12)); box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4); transition:transform .08s, box-shadow .08s; }
  .icon:active { transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); }
  main { padding:16px 12px 170px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border-radius:20px; padding:14px; margin-bottom:14px; box-shadow:0 2px 0 #d5dfda, 0 8px 20px rgba(31,69,53,.08); }
  .card h2 { display:flex; align-items:center; gap:8px; font-size:14px; margin:0 0 10px; color:var(--g2); font-weight:700; letter-spacing:.02em; }
  .card h2 i { font-style:normal; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--g); color:#fff; font-size:13px; box-shadow:0 2px 0 var(--gd); }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; font-weight:600; }
  input,select,textarea { width:100%; font:inherit; font-size:16px; min-height:46px; padding:10px 12px; border:1.5px solid var(--line); border-radius:14px; background:#fbfdfc; color:var(--tx); box-shadow:inset 0 2px 3px rgba(0,0,0,.04); }
  input[type=checkbox] { min-height:0; width:auto; box-shadow:none; }
  input:focus,select:focus,textarea:focus { outline:0; border-color:var(--g); box-shadow:0 0 0 3px rgba(53,104,84,.2); background:#fff; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; min-width:0; }

  /* ===== Nút bo tròn, nổi 3D ===== */
  .btn { display:block; border:0; border-radius:999px; padding:14px 18px; margin:0 0 6px; font:inherit; font-weight:700; color:#fff; width:100%; text-align:center; text-decoration:none; cursor:pointer;
    background:linear-gradient(180deg,var(--g1),var(--g)); box-shadow:0 5px 0 var(--gd), 0 9px 14px rgba(31,69,53,.3), inset 0 1px 0 rgba(255,255,255,.35); text-shadow:0 1px 0 rgba(0,0,0,.2);
    transition:transform .08s, box-shadow .08s; position:relative; }
  .btn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--gd), 0 3px 5px rgba(31,69,53,.3), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.sec { background:linear-gradient(180deg,#fafdfb,#dbeae1); color:var(--g2); text-shadow:none; box-shadow:0 5px 0 #b3cbbd, 0 9px 14px rgba(0,0,0,.1), inset 0 1px 0 #fff; }
  .btn.sec:active:not(:disabled) { box-shadow:0 1px 0 #b3cbbd, 0 3px 5px rgba(0,0,0,.1), inset 0 1px 0 #fff; }
  .btn.big { padding:16px 18px; font-size:17px; }
  .btn.sm { padding:10px 16px; font-size:14px; width:auto; box-shadow:0 4px 0 var(--gd), 0 7px 11px rgba(31,69,53,.28), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.sm.sec { box-shadow:0 4px 0 #b3cbbd, 0 7px 11px rgba(0,0,0,.1), inset 0 1px 0 #fff; }
  .btn:disabled { background:linear-gradient(180deg,#c9d3ce,#b4c0ba); box-shadow:0 4px 0 #94a39b; color:#eef3f0; text-shadow:none; }
  .btnrow { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .btnrow .btn { padding:13px 8px; font-size:15px; margin:0 0 5px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .hint { font-size:12.5px; color:var(--mut); margin-top:8px; }
  .hint a, .link { color:var(--g); font-weight:600; background:none; border:0; padding:0; font:inherit; text-decoration:underline; }

  /* ===== Các tab nguồn ===== */
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-bottom:4px; }
  .tabbtn { border:2px solid var(--line); border-radius:18px; padding:10px 10px 11px; font:inherit; text-align:left; color:var(--tx); background:linear-gradient(180deg,#fff,#f1f5f3); min-height:62px; position:relative;
    box-shadow:0 4px 0 #cfdad4, 0 8px 12px rgba(0,0,0,.07); transition:transform .08s, box-shadow .08s; }
  .tabbtn:active { transform:translateY(3px); box-shadow:0 1px 0 #cfdad4; }
  .tabbtn b { display:block; font-size:16px; }
  .tabbtn small { display:block; font-size:12px; color:var(--mut); margin-top:2px; }
  .tabbtn.loaded { border-color:var(--g); background:linear-gradient(180deg,#fff,#e6f1ea); box-shadow:0 4px 0 #9bbcab, 0 8px 12px rgba(0,0,0,.07); }
  .tabbtn.loaded small { color:var(--g2); }
  .tabbtn.part { border-color:#f2b14d; background:linear-gradient(180deg,#fffaf0,#ffefcf); box-shadow:0 4px 0 #e6c27d, 0 8px 12px rgba(0,0,0,.07); }
  .tabbtn.part small { color:#9a5b05; font-weight:600; }
  .tabbtn.done { border-color:var(--gd); background:linear-gradient(180deg,var(--g1),var(--g)); color:#fff; box-shadow:0 4px 0 var(--gd), 0 8px 12px rgba(31,69,53,.3); }
  .tabbtn.done small { color:#e5f4ec; font-weight:600; }
  .tabbtn.done::after { content:"✓"; position:absolute; right:10px; top:8px; width:24px; height:24px; border-radius:50%; background:#fff; color:var(--g); font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 rgba(0,0,0,.2); }
  .tabbtn.done:active { box-shadow:0 1px 0 var(--gd); }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--mut); margin-top:10px; }
  .legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid rgba(0,0,0,.15); }
  .legend .l1::before { background:var(--g); } .legend .l2::before { background:#ffd27d; } .legend .l3::before { background:#cfe6d8; }

  /* ===== Chip (modal tồn kho) ===== */
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { border:0; background:linear-gradient(180deg,#fff,#eef3f0); border-radius:999px; padding:9px 18px; font:inherit; font-weight:600; color:var(--tx); box-shadow:0 4px 0 #cbd7d1, 0 7px 10px rgba(0,0,0,.08); transition:transform .08s, box-shadow .08s; }
  .chip:active { transform:translateY(3px); box-shadow:0 1px 0 #cbd7d1; }
  .chip.on { background:linear-gradient(180deg,var(--g1),var(--g)); color:#fff; box-shadow:0 4px 0 var(--gd), 0 7px 10px rgba(31,69,53,.3); }

  /* ===== Đơn ===== */
  .ord { border-radius:18px; background:#fff; margin-bottom:14px; overflow:hidden; border:1.5px solid var(--line); border-left:6px solid var(--g1); box-shadow:0 3px 0 #d5dfda, 0 8px 16px rgba(31,69,53,.07); }
  .ord.warn { border-left-color:var(--amber); } .ord.bad { border-left-color:var(--bad); }
  .ord.off { opacity:.6; border-left-color:#b6c2bb; }
  .ord.done { background:#eef6f0; border-left-color:#7bb394; }
  .oh { display:flex; gap:12px; padding:12px; align-items:flex-start; }
  .oh input[type=checkbox] { appearance:none; -webkit-appearance:none; width:28px; height:28px; margin:2px 0 0; flex:none; border-radius:9px; border:2px solid #9db3a8; background:#fff; box-shadow:0 3px 0 #c5d3cb; position:relative; }
  .oh input[type=checkbox]:checked { background:var(--g); border-color:var(--gd); box-shadow:0 3px 0 var(--gd); }
  .oh input[type=checkbox]:checked::after { content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:17px; }
  .oh input[type=checkbox]:disabled { opacity:.45; }
  .oh .t { flex:1; min-width:0; }
  .oh .n { font-weight:700; font-size:17px; }
  .oh .p { color:var(--mut); font-size:13px; margin-top:1px; }
  .oh .chev { flex:none; width:36px; height:36px; border-radius:50%; background:#e6efe9; color:var(--g2); display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 3px 0 #c3d4ca; }
  .tag { display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:#eef1ef; color:var(--mut); margin:2px 4px 2px 0; }
  .tag.warn { background:#ffedd5; color:var(--warn); }
  .tag.ok { background:#dcfce7; color:var(--ok); }
  .tag.bad { background:#fee2e2; color:var(--bad); }
  .od { border-top:2px dashed var(--line); padding:12px; background:#f8fbf9; }
  .info { font-size:13px; color:var(--mut); white-space:pre-line; margin-bottom:10px; }
  .ln { border-radius:16px; padding:10px; margin-bottom:12px; background:#fff; border:1.5px solid var(--line); box-shadow:0 3px 0 #dbe4df; }
  .ln.gift { background:#fff8ec; border-color:#f4d9a8; box-shadow:0 3px 0 #ecd3a0; }
  .ln .row { margin-top:8px; }
  .ln .q { flex:0 0 84px; text-align:center; }
  .ln .x { flex:none; width:46px; border:0; background:linear-gradient(180deg,#fff1f1,#fecaca); color:var(--bad); border-radius:50%; height:46px; font-size:18px; box-shadow:0 4px 0 #e5a3a3; }
  .ln .x:active { transform:translateY(3px); box-shadow:0 1px 0 #e5a3a3; }
  .chk { font-size:14px; margin:8px 0; display:flex; align-items:center; gap:8px; color:var(--tx); font-weight:500; }
  .chk input { width:22px; height:22px; accent-color:var(--g); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-top:8px; font-size:13.5px; }
  .cols > div { padding:2px 8px 2px 0; min-width:0; }
  .cols > div + div { border-left:2px solid #e3b9b9; padding-left:10px; }
  .lab { font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--g); margin-bottom:3px; }
  .lab.r { color:#b91c1c; }
  .cols .real { white-space:pre-line; color:#7f1d1d; }
  .cb { position:relative; }
  .cbi.guess { border-color:#f59e0b; background:#fffbeb; }
  .cbl { position:absolute; left:0; right:0; top:100%; z-index:15; background:#fff; border:1.5px solid var(--g); border-radius:14px; margin-top:4px; max-height:240px; overflow:auto; box-shadow:0 10px 24px rgba(0,0,0,.22); }
  .cbo { padding:12px; border-bottom:1px solid #eef2f0; }
  .cbo:last-child { border-bottom:0; }
  .cbo.on { background:#e6efe9; }
  .cbo b { color:var(--g); }
  .alert { background:linear-gradient(180deg,#fff9f1,#ffedd5); border-radius:18px; padding:12px 14px; margin-bottom:14px; font-size:14px; color:#9a3412; box-shadow:0 3px 0 #f2c48f, 0 8px 14px rgba(154,52,18,.12); }
  .alert .out { color:#b91c1c; font-weight:700; }
  .srow { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #eef2f0; font-size:14.5px; }
  .srow:last-child { border-bottom:0; }
  .srow .v { text-align:right; white-space:nowrap; }
  .srow.tot { font-weight:700; border-top:2px solid var(--g); font-size:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .center { text-align:center; color:var(--mut); padding:24px 0; }
  .okcard { background:linear-gradient(180deg,#f3fbf6,#dff1e6); }

  /* ===== Thanh ghi cố định đáy ===== */
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-radius:22px 22px 0 0; box-shadow:0 -6px 18px rgba(31,69,53,.15); padding:10px 14px calc(12px + env(safe-area-inset-bottom)); z-index:6; }
  .bar .in { max-width:720px; margin:0 auto; }
  .bar .sum2 { display:flex; justify-content:space-between; font-size:13px; color:var(--mut); margin:0 4px 8px; }
  .bar .sum2 b { color:var(--tx); }
  .modal { position:fixed; inset:0; background:rgba(15,30,24,.5); z-index:20; display:none; align-items:flex-end; justify-content:center; }
  .modal.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:720px; border-radius:26px 26px 0 0; padding:22px 16px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; position:relative; animation:up .22s ease-out; box-shadow:0 -8px 30px rgba(0,0,0,.25); }
  .sheet::before { content:""; position:absolute; top:8px; left:50%; width:44px; height:5px; margin-left:-22px; border-radius:3px; background:#cdd8d2; }
  .sheet h3 { margin:0 0 6px; color:var(--g2); }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
  .toast { position:fixed; left:14px; right:14px; bottom:130px; background:#1f2937; color:#fff; padding:13px 16px; border-radius:18px; z-index:30; display:none; box-shadow:0 8px 20px rgba(0,0,0,.35); font-size:14.5px; }
  .toast.show { display:block; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #fff6; border-top-color:#fff; border-radius:50%; animation:r .7s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Bảng kê hóa đơn khách lẻ<small id="subtitle"></small></h1>
  <button class="icon" id="btnSettings" aria-label="Cài đặt">⚙</button>
</header>

<main id="main"></main>

<div class="bar" id="bar" style="display:none"><div class="in"><div class="sum2"><span id="barCnt"></span><span id="barSum"></span></div><button class="btn big" id="btnWrite" disabled>Ghi vào bảng kê</button></div></div>

<!-- Cài đặt / kết nối -->
<div class="modal" id="mSettings"><div class="sheet">
  <h3>Cài đặt</h3>
  <label>Địa chỉ API (link Apps Script đã triển khai, kết thúc bằng /exec)</label>
  <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
  <label>Mật khẩu (API_KEY)</label>
  <input id="cfgKey" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:12px"><button class="btn" id="cfgSave">Lưu &amp; kết nối</button><button class="btn sec" id="cfgClose">Đóng</button></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
  <h3>Đổi file An Maitri VNPost (đầu tháng)</h3>
  <p class="hint" id="srcNow"></p>
  <label>Dán link Google Sheet của tháng mới</label>
  <input id="srcUrl" placeholder="https://docs.google.com/spreadsheets/d/..." autocapitalize="off" autocorrect="off">
  <button class="btn sec" style="margin-top:10px" id="srcSave">Đổi file nguồn</button>
</div></div>

<!-- Thêm đơn tay -->
<div class="modal" id="mManual"><div class="sheet">
  <h3>Thêm đơn thủ công (VD: Viettel Post)</h3>
  <label>Tên khách</label><input id="mnName">
  <label>Số điện thoại</label><input id="mnPhone" inputmode="tel">
  <label>Địa chỉ</label><input id="mnAddr">
  <div class="row"><div><label>Thu hộ (VNĐ)</label><input id="mnCod" inputmode="numeric"></div><div><label>Tiền hàng (nghìn)</label><input id="mnTien" inputmode="numeric"></div></div>
  <label>Sản phẩm thực tế (cột P)</label><textarea id="mnSp" rows="2"></textarea>
  <label>Ship (cột S)</label><input id="mnShip" placeholder="VD: Khách chịu phí ship">
  <div class="row"><div><label>Mã hàng (cột U)</label><input id="mnSku" placeholder="MON / GAC / TRA5V"></div><div><label>Cân nặng kg (cột V)</label><input id="mnKg" inputmode="decimal"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="mnAdd">Thêm vào danh sách</button><button class="btn sec" id="mnClose">Hủy</button></div>
</div></div>

<!-- Tồn kho & doanh số -->
<div class="modal" id="mStock"><div class="sheet">
  <div class="row" style="margin-bottom:8px"><h3 style="flex:1;margin:0">Tồn kho &amp; doanh số</h3><button class="btn sec sm" id="stRefresh">Làm mới</button><button class="btn sec sm" id="stClose">Đóng</button></div>
  <div class="chips" id="stTabs" style="margin-bottom:10px"></div>
  <div id="stBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ===================== Cấu hình mặc định (sửa được) ===================== */
// Gợi ý sản phẩm hóa đơn theo mã hàng (cột AM). Chỉ là gợi ý – ô sẽ viền cam đến khi bạn chọn lại.
var SKU_DEFAULT_PRODUCT = {
  MON: 'Cốt nghệ mật ong lên men',
  GAC: 'Gấc lên men',
  MOG: 'Mật Ong Gừng quất muối',
  TRA5V: 'Màng Gấc tách hạt'
};
var FALLBACK_PRODUCT = 'Phôi xà bông';           // khi đơn không có mã hàng
var BOX_BY_SKU = { TRA5V: '25x15x11' };          // mã hàng -> kích thước hộp
var BOX_DEFAULT = '35x11x11';

/* ===================== Trạng thái ===================== */
var LS = 'amt_invoice_cfg_v1';
var cfg = load();
var S = { init: null, orders: [], tabsLoaded: {}, invoiceTab: '', busy: false };
var uid = 0;

function load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function fmt(n) { return (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('vi-VN'); }
function digits(s) { var d = String(s == null ? '' : s).replace(/[^\d]/g, ''); return d === '' ? '' : Number(d); }
function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 3500); }

/* ===================== Gọi API ===================== */
function api(action, data) {
  if (!cfg.url || !cfg.key) return Promise.reject(new Error('Chưa cài đặt API.'));
  var body = Object.assign({ key: cfg.key, action: action }, data || {});
  return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Lỗi không xác định'); return j; });
}

/* ===================== Logic đơn ===================== */
function unitFor(p) {
  if (/carton/i.test(p)) return 'Hộp';
  if (/xà bông|màng gấc/i.test(p)) return 'Kg';
  if (/\d+\s?ml|oil|hương/i.test(p)) return 'Chai 20ml';
  return 'Chai 500ml';
}
function findBox(size) {
  var b = (S.init.boxes || []).filter(function (x) { return x.indexOf(size) >= 0; })[0];
  return b || (S.init.boxes || [])[0] || '';
}
function newOrder(o) {
  var sku = String(o.sku || '').toUpperCase();
  var prod = SKU_DEFAULT_PRODUCT[sku] || FALLBACK_PRODUCT;
  if (S.init.products.indexOf(prod) < 0) prod = S.init.products[0] || prod;
  var cod = (o.cod === '' || o.cod == null) ? '' : Number(o.cod);
  var ord = Object.assign({ uid: ++uid, include: true, open: false, written: false, dupTabs: [] }, o, { cod: cod });
  ord.lines = [{ product: prod, unit: unitFor(prod), qty: 1, price: cod, gift: false, guess: true, priceTouched: false }];
  ord.boxOn = true;
  ord.box = findBox(BOX_BY_SKU[sku] || BOX_DEFAULT);
  return ord;
}
function effLines(o) {
  var ls = o.lines.slice();
  if (o.boxOn && o.box) ls.push({ product: o.box, unit: 'Hộp', qty: 1, price: 0, gift: true });
  return ls;
}
function lineTotal(l) { return l.gift ? 0 : (Number(l.qty) || 0) * (Number(l.price) || 0); }
function orderTotal(o) { return o.lines.reduce(function (s, l) { return s + lineTotal(l); }, 0); }
function orderIssue(o) {
  for (var i = 0; i < o.lines.length; i++) {
    var l = o.lines[i];
    if (!l.product) return 'Thiếu sản phẩm';
    if (!(Number(l.qty) > 0)) return 'Số lượng = 0';
    if (!l.gift && (l.price === '' || l.price == null || isNaN(l.price))) return 'Thiếu đơn giá';
  }
  return '';
}
function mismatch(o) { return o.cod !== '' && o.cod > 0 && Math.round(orderTotal(o)) !== Math.round(o.cod); }

/* ===================== Vẽ giao diện ===================== */
function render() {
  var m = $('main');
  if (!cfg.url || !cfg.key) {
    $('bar').style.display = 'none';
    m.innerHTML = '<div class="card"><h2>Chưa kết nối</h2><p>Nhập địa chỉ API và mật khẩu để bắt đầu.</p><button class="btn" id="goSet">Mở cài đặt</button></div>';
    $('goSet').onclick = openSettings; return;
  }
  if (!S.init) { m.innerHTML = '<div class="center">Đang kết nối…</div>'; $('bar').style.display = 'none'; return; }
  $('subtitle').textContent = 'Nguồn: ' + S.init.sourceTitle;

  var existing = S.init.invoiceTabs.indexOf(S.invoiceTab) >= 0;
  var h = '';
  var openUrl = S.lastUrl || S.init.invoiceUrl;
  var al = S.stock ? S.stock.alerts : [];
  h += '<div class="btnrow"><button class="btn" id="openStock">📊 Tồn kho' + (al.length ? ' <span style="background:#fff;color:#b91c1c;border-radius:999px;padding:1px 8px;text-shadow:none">' + al.length + '</span>' : '') + '</button>' +
    (openUrl ? '<a class="btn sec" href="' + esc(openUrl) + '" target="_blank" rel="noopener">📄 Mở bảng kê</a>' : '') + '</div>';
  if (al.length) h += '<div class="alert" id="alertBox"><b>⚠ Sản phẩm sắp hết / hết:</b><br>' + al.slice(0, 5).map(function (a) { return a.status === 'out' ? '<span class="out">' + esc(a.p) + ': hết/âm (' + fq(a.left) + ')</span>' : esc(a.p) + ': còn ' + fq(a.left) + ' ' + esc(a.unit) + (a.daysLeft !== '' ? ' (~' + a.daysLeft + ' ngày)' : ''); }).join('<br>') + (al.length > 5 ? '<br>… và ' + (al.length - 5) + ' sản phẩm khác' : '') + '</div>';
  if (S.lastUrl) h += '<div class="card okcard"><h2>✓ Đã ghi xong</h2><p style="margin:0 0 12px">Đã ghi vào tab <b>' + esc(S.lastTab) + '</b> trong file "DANH SÁCH XUẤT HÓA ĐƠN khách lẻ".</p><a class="btn" href="' + esc(S.lastUrl) + '" target="_blank" rel="noopener">Mở bảng kê tab ' + esc(S.lastTab) + '</a></div>';
  h += '<div class="card"><h2><i>1</i>Tab hóa đơn</h2><input id="invTab" value="' + esc(S.invoiceTab) + '" inputmode="decimal" placeholder="dd.mm">';
  h += '<div class="hint">' + (existing ? 'Tab đã có – đơn mới được nối tiếp phía dưới.' : 'Chưa có tab này – sẽ tự tạo (nhân bản từ tab gần nhất) khi ghi.') + '</div></div>';

  h += '<div class="card"><h2><i>2</i>Lấy đơn từ An Maitri VNPost</h2><div class="tabs">';
  S.init.sourceTabs.forEach(function (t) {
    var ts = tabState(t), loaded = S.tabsLoaded[t], cls = ts.st === 'done' ? ' done' : ts.st === 'part' ? ' part' : loaded ? ' loaded' : '', sub;
    if (loaded === 'loading') sub = 'Đang tải…';
    else if (ts.st === 'done') sub = 'Đã lấy xong · ' + ts.n + '/' + ts.total + ' đơn';
    else if (ts.st === 'part') sub = 'Đã ghi ' + ts.n + (ts.total ? '/' + ts.total : '') + ' đơn';
    else if (loaded) sub = 'Đã tải · ' + S.orders.filter(function (o) { return o.tab === t; }).length + ' đơn';
    else sub = 'Chưa lấy';
    h += '<button class="tabbtn' + cls + (loaded ? ' loaded' : '') + '" data-tab="' + esc(t) + '"><b>' + esc(t) + '</b><small>' + sub + '</small></button>';
  });
  h += '</div><div class="legend"><span class="l1">Đã lấy xong</span><span class="l2">Mới lấy một phần</span><span class="l3">Đang tải trong danh sách</span></div>';
  h += '<div class="hint">Chạm tab để tải đơn; chạm lần nữa để bỏ. Đơn đã ghi trước đó sẽ tự bỏ chọn. <button class="link" id="clrDone">Xóa đánh dấu</button></div>';
  h += '<button class="btn sec sm" id="addManual" style="margin-top:12px">+ Thêm đơn thủ công (VTP…)</button></div>';

  var list = S.orders;
  h += '<div class="card"><h2><i>3</i>Đơn <span id="selCnt">(' + list.filter(function (o) { return o.include && !o.written; }).length + '/' + list.length + ' đã chọn)</span></h2>';
  if (!list.length) h += '<div class="center">Chưa có đơn. Chọn tab ở bước 2.</div>';
  else {
    h += '<div class="row" style="margin-bottom:12px"><button class="btn sec sm" id="selAll">Chọn tất cả</button><button class="btn sec sm" id="selNone">Bỏ chọn</button></div>';
    list.forEach(function (o) { h += orderHtml(o); });
  }
  h += '</div>';
  m.innerHTML = h;
  bind();
  refreshBar();
}

function orderHtml(o) {
  var iss = orderIssue(o), mm = mismatch(o);
  var h = '<div class="ord' + (o.include ? '' : ' off') + (o.written ? ' done' : '') + (iss ? ' bad' : mm ? ' warn' : '') + '" data-u="' + o.uid + '">';
  h += '<div class="oh"><input type="checkbox" data-a="inc"' + (o.include && !o.written ? ' checked' : '') + (o.written ? ' disabled' : '') + '>';
  h += '<div class="t" data-a="open"><div class="n">' + esc(o.name) + (o.written ? '<span class="tag ok">đã ghi</span>' : o.prev ? '<span class="tag ok">đã ghi trước đó</span>' : '');
  if (o.dupTabs && o.dupTabs.length) h += '<span class="tag warn">SĐT đã có ở tab ' + esc(o.dupTabs.join(', ')) + '</span>';
  h += '</div><div class="p">' + esc(o.phone) + ' · Thu hộ ' + (o.cod === '' ? '—' : fmt(o.cod)) + ' · ' + esc(o.tab || 'tay') + '</div>';
  h += '<div class="cols"><div><div class="lab">XUẤT HÓA ĐƠN</div>' + effLines(o).map(function (l) { return '<div>' + (l.gift ? '🎁 ' : '') + esc(l.qty) + ' × ' + esc(l.product) + (l.gift ? ' (0đ)' : ' · ' + fmt(l.price)) + '</div>'; }).join('') + '</div>';
  h += '<div><div class="lab r">BÁN THỰC TẾ</div><div class="real">' + (esc(o.sp) || '—') + '</div></div></div>';
  if (iss) h += '<span class="tag bad">' + iss + '</span>';
  else if (mm) h += '<span class="tag warn">Tổng HĐ ' + fmt(orderTotal(o)) + ' ≠ thu hộ ' + fmt(o.cod) + '</span>';
  h += '</div><div class="chev" data-a="open">' + (o.open ? '▲' : '▼') + '</div></div>';
  if (o.open) h += detailHtml(o);
  return h + '</div>';
}

function detailHtml(o) {
  var h = '<div class="od"><div class="info">' + esc(o.addr) + '\nTiền hàng: ' + esc(o.tien) + ' · Ship: ' + esc(o.ship) + ' · Mã: ' + esc(o.sku) + ' · ' + esc(o.kg) + ' kg</div>';
  o.lines.forEach(function (l, i) {
    h += '<div class="ln' + (l.gift ? ' gift' : '') + '" data-i="' + i + '">';
    h += '<div class="lab" style="margin-top:2px">SP XUẤT HÓA ĐƠN' + (l.guess ? ' <span style="color:#b45309">(gợi ý – kiểm tra lại)</span>' : '') + '</div>';
    h += '<div class="cb"><input class="cbi' + (l.guess ? ' guess' : '') + '" data-f="product" value="' + esc(l.product) + '" placeholder="Gõ để tìm sản phẩm…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="cbl" hidden></div></div>';
    h += '<div class="row"><input class="q" data-f="qty" inputmode="decimal" value="' + esc(l.qty) + '" placeholder="SL">';
    h += '<select data-f="unit">' + opts(S.init.units, l.unit) + '</select>';
    h += '<button class="x" data-a="del">✕</button></div>';
    h += '<div class="row">' + (l.gift ? '<input value="QUÀ TẶNG – 0đ" disabled>' : '<input data-f="price" inputmode="numeric" value="' + esc(fmt(l.price)) + '" placeholder="Đơn giá (VNĐ)">') + '</div>';
    h += '<label class="chk"><input type="checkbox" data-f="gift"' + (l.gift ? ' checked' : '') + '> Quà tặng (0đ)</label></div>';
  });
  h += '<div class="row"><button class="btn sec sm" data-a="addp">+ Sản phẩm</button><button class="btn sec sm" data-a="addg">+ Quà tặng</button></div>';
  h += '<label class="chk" style="margin-top:12px"><input type="checkbox" data-a="boxon"' + (o.boxOn ? ' checked' : '') + '> Kèm hộp carton quà tặng</label>';
  if (o.boxOn) h += '<select data-a="box">' + opts(S.init.boxes, o.box) + '</select>';
  h += '<div class="chk">Tổng hóa đơn: <b>' + fmt(orderTotal(o)) + '</b>' + (o.cod !== '' ? ' · Thu hộ: <b>' + fmt(o.cod) + '</b>' : '') + '</div></div>';
  return h;
}
function opts(arr, cur) {
  var a = arr.slice(); if (cur && a.indexOf(cur) < 0) a.unshift(cur);
  return a.map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
}

function refreshBar() {
  var sel = S.orders.filter(function (o) { return o.include && !o.written; });
  var bar = $('bar'); bar.style.display = S.orders.length ? 'block' : 'none';
  var b = $('btnWrite');
  b.disabled = S.busy || !sel.length;
  b.innerHTML = S.busy ? '<span class="spin"></span>Đang ghi…' : 'Ghi ' + sel.length + ' đơn vào tab ' + esc(S.invoiceTab);
  $('barCnt').innerHTML = 'Đã chọn <b>' + sel.length + '</b> đơn';
  $('barSum').innerHTML = 'Tổng hóa đơn <b>' + fmt(sel.reduce(function (s2, o) { return s2 + orderTotal(o); }, 0)) + '</b>';
}

/* ===================== Sự kiện ===================== */
function find(u) { return S.orders.filter(function (o) { return o.uid === Number(u); })[0]; }

function bind() {
  var os = $('openStock'); if (os) os.onclick = openStock;
  var ab = $('alertBox'); if (ab) ab.onclick = function () { S.stockTab = 'stock'; openStock(); };
  var inv = $('invTab');
  if (inv) inv.oninput = function () { S.invoiceTab = inv.value.trim(); refreshBar(); };
  if (inv) inv.onchange = function () { render(); loadStock(); };
  Array.prototype.forEach.call(document.querySelectorAll('#main .tabbtn'), function (c) { c.onclick = function () { toggleTab(c.getAttribute('data-tab')); }; });
  var cd = $('clrDone'); if (cd) cd.onclick = function () { if (confirm('Xóa đánh dấu "đã lấy xong" của tất cả tab trong file nguồn này?')) { cfg.done = cfg.done || {}; delete cfg.done[S.init.sourceTitle]; save(); render(); } };
  var am = $('addManual'); if (am) am.onclick = function () { $('mManual').classList.add('show'); };
  var sa = $('selAll'); if (sa) sa.onclick = function () { S.orders.forEach(function (o) { if (!o.written) o.include = true; }); render(); };
  var sn = $('selNone'); if (sn) sn.onclick = function () { S.orders.forEach(function (o) { o.include = false; }); render(); };
  Array.prototype.forEach.call(document.querySelectorAll('.ord'), function (el) {
    var o = find(el.getAttribute('data-u'));
    el.addEventListener('click', function (ev) {
      var t = ev.target, a = t.getAttribute && t.getAttribute('data-a');
      if (a === 'open' || (t.closest && t.closest('[data-a="open"]'))) { o.open = !o.open; render(); return; }
      if (a === 'inc') { o.include = t.checked; el.classList.toggle('off', !o.include); refreshBar(); $('selCnt').textContent = '(' + S.orders.filter(function (x) { return x.include && !x.written; }).length + '/' + S.orders.length + ' đã chọn)'; return; }
      var ln = t.closest && t.closest('.ln'); var i = ln ? Number(ln.getAttribute('data-i')) : -1;
      if (a === 'del') { if (o.lines.length > 1) { o.lines.splice(i, 1); render(); } else toast('Cần ít nhất 1 dòng sản phẩm.'); return; }
      if (a === 'addp') { var p = S.init.products[0]; o.lines.push({ product: p, unit: unitFor(p), qty: 1, price: '', gift: false, priceTouched: true }); render(); return; }
      if (a === 'addg') { var g = S.init.products[0]; o.lines.push({ product: g, unit: unitFor(g), qty: 1, price: 0, gift: true }); render(); return; }
      if (a === 'boxon') { o.boxOn = t.checked; render(); return; }
    });
    el.addEventListener('change', function (ev) {
      var t = ev.target, f = t.getAttribute && t.getAttribute('data-f'), a = t.getAttribute && t.getAttribute('data-a');
      if (a === 'box') { o.box = t.value; render(); return; }
      if (!f || f === 'product') return;   // ô sản phẩm do bộ tìm kiếm xử lý
      var ln = t.closest('.ln'), l = o.lines[Number(ln.getAttribute('data-i'))];
      if (f === 'unit') l.unit = t.value;
      else if (f === 'gift') { l.gift = t.checked; if (l.gift) l.price = 0; else if (l.price === 0) l.price = ''; }
      else if (f === 'qty') {
        l.qty = Number(String(t.value).replace(',', '.')) || 0;
        if (!l.priceTouched && o.lines.length === 1 && o.cod !== '' && l.qty > 0) l.price = Math.round(o.cod / l.qty);
      }
      else if (f === 'price') { l.price = digits(t.value); l.priceTouched = true; }
      render();
    });
  });
}

/* ===== Đánh dấu tab đã lấy dữ liệu (lưu trong máy, theo từng file nguồn) ===== */
function doneStore() { var k = S.init.sourceTitle; cfg.done = cfg.done || {}; cfg.done[k] = cfg.done[k] || {}; return cfg.done[k]; }
function rowKey(o) { return o.tab && o.row ? o.tab + '|' + o.row : ''; }
function tabState(t) {
  var rec = doneStore()[t]; if (!rec || !rec.rows.length) return { st: 'none' };
  var n = rec.rows.length;
  return rec.total && n >= rec.total ? { st: 'done', n: n, total: rec.total } : { st: 'part', n: n, total: rec.total || 0 };
}
function toggleTab(t) {
  if (S.tabsLoaded[t]) {
    S.orders = S.orders.filter(function (o) { return o.tab !== t || o.written; });
    delete S.tabsLoaded[t]; render(); return;
  }
  S.tabsLoaded[t] = 'loading';
  toast('Đang tải tab ' + t + '…', 1500);
  api('source', { tab: t, invoiceTab: S.invoiceTab }).then(function (r) {
    S.tabsLoaded[t] = true;
    var st = doneStore(), rec = st[t] = st[t] || { rows: [], total: 0, at: 0 }; rec.total = r.orders.length; save();
    r.orders.forEach(function (o) {
      var ord = newOrder(o), k = rowKey(ord);
      if (k && rec.rows.indexOf(k) >= 0) { ord.include = false; ord.prev = true; }
      S.orders.push(ord);
    });
    if (!r.orders.length) toast('Tab ' + t + ' không có đơn.');
    render();
  }).catch(function (e) { delete S.tabsLoaded[t]; render(); toast('Lỗi: ' + e.message, 6000); });
}

/* ===================== Ghi vào bảng kê ===================== */
function write() {
  var sel = S.orders.filter(function (o) { return o.include && !o.written; });
  if (!sel.length || S.busy) return;
  if (!/^\d{1,2}[.\/]\d{1,2}$/.test(S.invoiceTab)) { toast('Tên tab chưa đúng (ví dụ 19.11).'); return; }
  var bad = sel.filter(function (o) { return orderIssue(o); });
  if (bad.length) { toast('Đơn "' + bad[0].name + '": ' + orderIssue(bad[0]), 5000); bad[0].open = true; render(); return; }
  var mm = sel.filter(mismatch), dp = sel.filter(function (o) { return o.dupTabs && o.dupTabs.length; });
  var msg = 'Ghi ' + sel.length + ' đơn vào tab ' + S.invoiceTab + '?';
  if (mm.length) msg += '\n\n⚠ ' + mm.length + ' đơn có tổng hóa đơn khác tiền thu hộ.';
  if (dp.length) msg += '\n⚠ ' + dp.length + ' đơn có SĐT đã xuất hóa đơn gần đây.';
  if (!confirm(msg)) return;
  S.busy = true; refreshBar();
  var payload = sel.map(function (o) {
    return { name: o.name, phone: o.phone, addr: o.addr, cod: o.cod, sp: o.sp, tien: o.tien, dg: o.dg, ship: o.ship, ghichu: o.ghichu, sku: o.sku, kg: o.kg,
      lines: effLines(o).map(function (l) { return { product: l.product, unit: l.unit, qty: Number(l.qty), price: l.gift ? 0 : Number(l.price), gift: !!l.gift }; }) };
  });
  api('append', { invoiceTab: S.invoiceTab, orders: payload }).then(function (r) {
    sel.forEach(function (o) {
      o.written = true; o.include = false; o.open = false;
      var k = rowKey(o); if (k) { var st = doneStore(), rec = st[o.tab] = st[o.tab] || { rows: [], total: 0, at: 0 }; if (rec.rows.indexOf(k) < 0) rec.rows.push(k); rec.at = Date.now(); }
    });
    save();
    if (S.init.invoiceTabs.indexOf(r.tab) < 0) S.init.invoiceTabs.unshift(r.tab);
    S.busy = false; S.lastUrl = r.url; S.lastTab = r.tab; render(); window.scrollTo(0, 0);
    toast('✓ Đã ghi ' + r.orders + ' đơn (' + r.rows + ' dòng) vào tab ' + r.tab + (r.created ? ' (tab mới)' : '') + '. Tổng tab: ' + r.totalCell, 8000);
    cfg.lastUrl = r.url; save(); loadStock(true);
  }).catch(function (e) { S.busy = false; refreshBar(); toast('Lỗi: ' + e.message, 8000); });
}

$('btnWrite').onclick = write;
$('mSettings').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
$('mManual').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });


/* ===================== Ô tìm sản phẩm (gõ không dấu cũng ra) ===================== */
function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase(); }
function allProducts() { return S.init ? S.init.products.concat(S.init.boxes) : []; }
function searchProducts(q) {
  var toks = norm(q).split(/\s+/).filter(Boolean), list = allProducts();
  if (!toks.length) return list;
  return list.filter(function (p) { var n = norm(p); return toks.every(function (t) { return n.indexOf(t) >= 0; }); })
    .sort(function (a, b) { return (norm(a).indexOf(toks[0]) === 0 ? 0 : 1) - (norm(b).indexOf(toks[0]) === 0 ? 0 : 1); });
}
function hilite(p, q) {
  var toks = norm(q).split(/\s+/).filter(Boolean); if (!toks.length) return esc(p);
  var np = norm(p), mark = new Array(p.length).fill(false);   // norm giữ nguyên độ dài (NFD đã bỏ dấu sau khi ghép lại)
  if (np.length !== p.length) return esc(p);
  toks.forEach(function (t) { var i = np.indexOf(t); if (i >= 0) for (var k = i; k < i + t.length; k++) mark[k] = true; });
  var out = '', open = false;
  for (var i = 0; i < p.length; i++) { if (mark[i] && !open) { out += '<b>'; open = true; } if (!mark[i] && open) { out += '</b>'; open = false; } out += esc(p[i]); }
  return out + (open ? '</b>' : '');
}
function cbShow(inp) {
  var box = inp.parentNode.querySelector('.cbl'), q = inp.getAttribute('data-q') === '1' ? inp.value : '';
  var res = searchProducts(q);
  box.innerHTML = res.length ? res.map(function (p, i) { return '<div class="cbo' + (i === 0 ? ' on' : '') + '" data-v="' + esc(p) + '">' + hilite(p, q) + '</div>'; }).join('') : '<div class="cbo">Không thấy sản phẩm phù hợp</div>';
  box.hidden = false;
}
function cbHide(inp) { var b = inp.parentNode.querySelector('.cbl'); if (b) b.hidden = true; }
function cbLine(inp) {
  var ord = find(inp.closest('.ord').getAttribute('data-u')), i = Number(inp.closest('.ln').getAttribute('data-i'));
  return { o: ord, l: ord.lines[i] };
}
function cbPick(inp, val) {
  var c = cbLine(inp);
  if (val !== c.l.product) { c.l.product = val; c.l.unit = unitFor(val); }
  c.l.guess = false; inp.setAttribute('data-picked', '1'); render();
}
document.addEventListener('focusin', function (e) {
  var t = e.target; if (!t.classList || !t.classList.contains('cbi')) return;
  t.setAttribute('data-q', '0'); t.setAttribute('data-picked', ''); t.select(); cbShow(t);
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!t.classList || !t.classList.contains('cbi')) return;
  t.setAttribute('data-q', '1'); cbShow(t);
});
document.addEventListener('keydown', function (e) {
  var t = e.target; if (!t.classList || !t.classList.contains('cbi')) return;
  if (e.key === 'Enter') { e.preventDefault(); var first = t.parentNode.querySelector('.cbo.on[data-v]'); if (first) cbPick(t, first.getAttribute('data-v')); }
  if (e.key === 'Escape') t.blur();
});
document.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('.cbl')) e.preventDefault(); });   // giữ focus để chọn được
document.addEventListener('click', function (e) {
  var o = e.target.closest && e.target.closest('.cbo[data-v]'); if (!o) return;
  var inp = o.closest('.cb').querySelector('.cbi'); cbPick(inp, o.getAttribute('data-v'));
});
document.addEventListener('focusout', function (e) {
  var t = e.target; if (!t.classList || !t.classList.contains('cbi') || t.getAttribute('data-picked') === '1') return;
  var typed = norm(t.value).trim(), hit = allProducts().filter(function (p) { return norm(p) === typed; })[0];
  cbHide(t);
  var c = cbLine(t);
  if (hit && hit !== c.l.product) { cbPick(t, hit); return; }
  t.value = c.l.product;   // gõ chưa khớp sản phẩm nào -> trả về giá trị cũ
});

/* ===================== Tồn kho & doanh số ===================== */
function fq(n) { return (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 2 }); }
function loadStock(refresh) {
  if (!S.init) return Promise.resolve();
  S.stockLoading = true; renderStockIfOpen();
  return api('stock', { date: S.invoiceTab, refresh: !!refresh }).then(function (r) { S.stock = r; S.stockLoading = false; S.stockErr = ''; render(); renderStockIfOpen(); })
    .catch(function (e) { S.stockLoading = false; S.stockErr = e.message; renderStockIfOpen(); });
}
function stBadge(it) {
  if (it.status === 'out') return '<span class="tag bad">HẾT / ÂM</span>';
  if (it.status === 'low') return '<span class="tag warn">Gần hết' + (it.daysLeft !== '' ? ' · ~' + it.daysLeft + ' ngày' : '') + '</span>';
  if (it.status === 'ok') return '<span class="tag ok">Còn đủ</span>';
  return '<span class="tag">Chưa kiểm kê</span>';
}
function renderStockIfOpen() { if ($('mStock').classList.contains('show')) renderStock(); }
function renderStock() {
  var tabs = [['day', 'Hôm nay'], ['month', 'Tháng'], ['stock', 'Tồn kho']];
  $('stTabs').innerHTML = tabs.map(function (t) { return '<button class="chip' + (S.stockTab === t[0] ? ' on' : '') + '" data-st="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  var b = $('stBody'), r = S.stock;
  if (!r) { b.innerHTML = '<div class="center">' + (S.stockErr ? 'Lỗi: ' + esc(S.stockErr) : 'Đang tính số liệu…') + '</div>'; return; }
  var h = S.stockLoading ? '<div class="hint">Đang cập nhật…</div>' : '';
  if (S.stockTab === 'day' || S.stockTab === 'month') {
    var d = S.stockTab === 'day' ? r.day : r.month;
    h += '<div class="hint">' + (S.stockTab === 'day' ? 'Tab ' + esc(r.date) : 'Tháng ' + esc(r.monthLabel) + ' (đến ' + esc(r.date) + ')') + ' · gồm cả hộp carton quà tặng</div>';
    h += '<div class="srow tot"><span>Tổng tiền xuất</span><span class="v">' + fmt(d.total) + '</span></div>';
    h += d.rows.length ? d.rows.map(function (x) { return '<div class="srow"><span>' + esc(x.p) + '</span><span class="v">' + fq(x.qty) + ' · ' + fmt(x.money) + '</span></div>'; }).join('') : '<div class="center">Chưa có số liệu.</div>';
  } else if (!S.stockEdit) {
    h += '<div class="hint">Còn lại = số kiểm kê − số đã xuất sau ngày kiểm kê. Cảnh báo khi còn dưới ' + r.warnDays + ' ngày (theo tốc độ xuất ' + r.avgDays + ' ngày gần nhất) hoặc chạm ngưỡng bạn đặt.</div>';
    h += '<button class="btn sm" id="stEdit" style="margin:8px 0">Nhập / sửa số kiểm kê</button>';
    var its = r.items.slice().sort(function (a, b2) { var w = { out: 0, low: 1, ok: 2, none: 3 }; return w[a.status] - w[b2.status]; });
    h += its.map(function (it) {
      return '<div class="srow"><span>' + esc(it.p) + '<div class="hint" style="margin:0">' + (it.status === 'none' ? 'Chưa có số kiểm kê' : 'Kiểm kê ' + fq(it.base) + ' (' + esc(it.baseDate) + ') · đã xuất ' + fq(it.out)) + '</div></span><span class="v">' + (it.status === 'none' ? '' : '<b>' + fq(it.left) + '</b> ' + esc(it.unit)) + '<div>' + stBadge(it) + '</div></span></div>';
    }).join('');
  } else {
    h += '<div class="hint">Nhập số lượng thực tế tồn ở ngày kiểm kê. Để trống = không theo dõi sản phẩm đó. Ngưỡng là số lượng, chạm ngưỡng thì cảnh báo (không bắt buộc).</div>';
    r.items.forEach(function (it, i) {
      h += '<div class="ln" data-k="' + i + '"><b>' + esc(it.p) + '</b><div class="grid3" style="margin-top:6px"><div><label>Tồn kiểm kê</label><input data-e="base" inputmode="decimal" value="' + esc(it.base) + '"></div>' +
        '<div><label>Ngày kiểm kê</label><input type="date" data-e="date" value="' + esc(dmyToIso(it.baseDate)) + '"></div>' +
        '<div><label>Ngưỡng</label><input data-e="thr" inputmode="decimal" value="' + esc(it.thr) + '"></div></div></div>';
    });
    h += '<div class="row" style="margin-top:10px"><button class="btn" id="stSave">Lưu số kiểm kê</button><button class="btn sec" id="stCancel">Hủy</button></div>';
  }
  b.innerHTML = h;
}
function dmyToIso(t) { var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t || ''); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function saveStock() {
  var today = new Date(), iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
  var items = [];
  Array.prototype.forEach.call($('stBody').querySelectorAll('[data-k]'), function (el) {
    var it = S.stock.items[Number(el.getAttribute('data-k'))];
    var g = function (k) { return el.querySelector('[data-e=' + k + ']').value.trim().replace(',', '.'); };
    var base = g('base'); if (base === '') return;
    items.push({ p: it.p, unit: it.unit || unitFor(it.p), base: base, date: g('date') || iso, thr: g('thr') });
  });
  api('setStock', { items: items }).then(function (r) { toast('Đã lưu ' + r.saved + ' số kiểm kê.'); S.stockEdit = false; return loadStock(true); })
    .catch(function (e) { toast('Lỗi: ' + e.message, 7000); });
}
function openStock() { S.stockTab = S.stockTab || 'day'; S.stockEdit = false; $('mStock').classList.add('show'); renderStock(); if (!S.stock) loadStock(); }
$('stClose').onclick = function () { $('mStock').classList.remove('show'); };
$('stRefresh').onclick = function () { loadStock(true); };
$('mStock').addEventListener('click', function (e) {
  var t = e.target;
  if (t === this) { this.classList.remove('show'); return; }
  var st = t.getAttribute && t.getAttribute('data-st'); if (st) { S.stockTab = st; S.stockEdit = false; renderStock(); return; }
  if (t.id === 'stEdit') { S.stockEdit = true; renderStock(); }
  if (t.id === 'stCancel') { S.stockEdit = false; renderStock(); }
  if (t.id === 'stSave') saveStock();
});

function start() {
  S.init = null; render();
  if (!cfg.url || !cfg.key) return;
  api('init').then(function (r) {
    S.init = r; if (!S.invoiceTab) S.invoiceTab = r.today; render(); loadStock();
  }).catch(function (e) { $('main').innerHTML = '<div class="card"><h2>Không kết nối được</h2><p>' + esc(e.message) + '</p><button class="btn" id="retry">Thử lại</button> <button class="btn sec" id="goSet2" style="margin-top:8px">Cài đặt</button></div>'; $('retry').onclick = start; $('goSet2').onclick = openSettings; });
}
start();
</script>
</body>
</html>
